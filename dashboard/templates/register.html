```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | TrafficVision AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        /* =====================================================
           REGISTER PAGE
           Matches the current TrafficVision AI login design
           ===================================================== */

        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            position: relative;
            overflow: hidden;
            background: #07111f;
        }

        /* Background glow */

        .register-page::before,
        .register-page::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            pointer-events: none;
        }

        .register-page::before {
            background: #6d5dfc;
            top: -180px;
            left: -150px;
        }

        .register-page::after {
            background: #3b82f6;
            bottom: -200px;
            right: -150px;
        }


        /* Main wrapper */

        .register-wrapper {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
            animation: registerFadeIn 0.7s ease;
        }

        @keyframes registerFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Brand */

        .register-brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .register-brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 14px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ffffff;
            background: linear-gradient(
                135deg,
                #6d5dfc,
                #3b82f6
            );
            box-shadow:
                0 12px 35px rgba(109, 93, 252, 0.35);
        }

        .register-brand h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #e8f0f8;
        }

        .register-brand p {
            color: #8fa3b8;
            margin: 0;
        }


        /* Register card */

        .register-card {
            background: rgba(13, 27, 45, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }


        /* Back to home */

        .register-home-link {
            margin-bottom: 24px;
        }

        .register-home-link a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #71859a;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .register-home-link a:hover {
            color: #a79cff;
        }


        /* Heading */

        .register-heading {
            margin-bottom: 24px;
        }

        .register-heading h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .register-heading p {
            color: #8fa3b8;
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }


        /* Labels */

        .register-label {
            color: #cbd5e1;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }


        /* Inputs */

        .register-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: #e8f0f8;
            border-radius: 12px;
            padding: 12px 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .register-input::placeholder {
            color: #64748b;
        }

        .register-input:focus {
            border-color: #6d5dfc;
            box-shadow:
                0 0 0 3px rgba(109, 93, 252, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }


        /* Create account button */

        .register-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            margin-top: 8px;
            color: #ffffff;
            font-weight: 700;
            background: linear-gradient(
                135deg,
                #6d5dfc,
                #3b82f6
            );
            box-shadow:
                0 12px 28px rgba(109, 93, 252, 0.25);
            transition: all 0.25s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            color: #ffffff;
            box-shadow:
                0 16px 32px rgba(109, 93, 252, 0.35);
        }


        /* Error message */

        .register-error {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            padding: 13px 14px;
            border-radius: 12px;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.28);
            border: 1px solid rgba(248, 113, 113, 0.35);
            font-size: 14px;
        }


        /* Sign in link */

        .login-register-link {
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            text-align: center;
            color: #8497aa;
            font-size: 13px;
        }

        .login-register-link a {
            color: #9b91ff;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-register-link a:hover {
            color: #ffffff;
            text-decoration: underline;
        }


        /* Footer */

        .register-footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }


        /* Mobile */

        @media (max-width: 480px) {

            .register-card {
                padding: 22px;
                border-radius: 20px;
            }

            .register-brand h1 {
                font-size: 24px;
            }

            .register-heading h2 {
                font-size: 22px;
            }
        }


        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {

            .register-wrapper {
                animation: none;
            }

            .register-btn,
            .register-input,
            .login-register-link a {
                transition: none;
            }
        }
    </style>
</head>


<body>

<div class="register-page">

    <div class="register-wrapper">


        <!-- ================= BRAND ================= -->

        <div class="register-brand">

            <div class="register-brand-icon">
                <i class="bi bi-eye-fill"></i>
            </div>

            <h1>TrafficVision AI</h1>

            <p>
                AI-Powered Traffic Intelligence
            </p>

        </div>


        <!-- ================= REGISTER CARD ================= -->

        <div class="register-card">


            <!-- Back to Home -->

            <div class="register-home-link">

                <a href="{{ url_for('index') }}">

                    <i class="bi bi-arrow-left"></i>

                    Back to Home

                </a>

            </div>


            <!-- Heading -->

            <div class="register-heading">

                <h2>
                    Create your account
                </h2>

                <p>
                    Register to access your traffic monitoring dashboard.
                </p>

            </div>


            <!-- Error Message -->

            {% if error %}

            <div class="register-error">

                <i class="bi bi-exclamation-triangle-fill"></i>

                <div>
                    {{ error }}
                </div>

            </div>

            {% endif %}


            <!-- Registration Form -->

            <form
                method="POST"
                action="{{ url_for('register') }}"
            >


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="register-label"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="register-input"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="register-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="register-input"
                        placeholder="Enter email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="register-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="register-input"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <label
                        for="confirm_password"
                        class="register-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="register-input"
                        placeholder="Confirm your password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="register-btn"
                >

                    <i class="bi bi-person-plus me-1"></i>

                    Create Account

                </button>


            </form>


            <!-- Sign In -->

            <div class="login-register-link">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Sign In
                </a>

            </div>


        </div>


        <!-- Footer -->

        <div class="register-footer">

            TrafficVision AI © 2026

        </div>


    </div>

</div>

</body>
</html>
```
